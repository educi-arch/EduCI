<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer mon compte - EduCI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page-inscription">

        <div class="inscription-container">

            <div class="logo-inscription">
                📚
            </div>

            <h1>Créer mon compte</h1>

            <p class="texte-intro">
                Rejoins EduCI et commence tes révisions de 3e 🇨🇮📚
            </p>


            <form id="formInscription">

                <label for="prenom">Prénom</label>

                <input
                    type="text"
                    id="prenom"
                    placeholder="Entre ton prénom"
                    required
                >


                <label for="email">Adresse e-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="exemple@email.com"
                    required
                >


                <label for="motDePasse">Mot de passe</label>

                <input
                    type="password"
                    id="motDePasse"
                    placeholder="Crée ton mot de passe"
                    required
                >


                <label for="confirmation">
                    Confirmer le mot de passe
                </label>

                <input
                    type="password"
                    id="confirmation"
                    placeholder="Répète ton mot de passe"
                    required
                >


                <label class="conditions">

                    <input
                        type="checkbox"
                        id="conditions"
                        required
                    >

                    <span>
                        J'accepte les conditions d'utilisation
                    </span>

                </label>


                <button type="submit" class="bouton-principal">
                    Créer mon compte 🚀
                </button>

            </form>


            <p class="connexion-link">
                Tu as déjà un compte ?
                <a href="#">Se connecter</a>
            </p>

        </div>

    </main>
<script>
    const formulaire = document.getElementById("formInscription");

    formulaire.addEventListener("submit", function(event) {
        event.preventDefault();

        const motDePasse =
            document.getElementById("motDePasse").value;

        const confirmation =
            document.getElementById("confirmation").value;

        if (motDePasse !== confirmation) {
            alert("Les deux mots de passe ne correspondent pas. 🔐");
            return;
        }

        window.location.href = "profil.html";
    });
</script>
</body>
</html>
